name: Security Profile Runtime

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-isolation:
    name: Android profile isolation instrumentation
    # GitHub-hosted macOS Intel runners expose fewer than 6 logical cores, so the
    # Android emulator is forced down to a single virtual core and routinely
    # exceeds the boot timeout or fails to install the test APKs. Ubuntu runners
    # provide KVM hardware acceleration, which is the supported way to run the
    # emulator in CI and is an order of magnitude faster.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun link
          bun install

      - name: Bundle web assets
        run: bun bundle:es

      - name: Generate Android project
        env:
          NORANUIM_CI_X86: '1'
        run: bun expo prebuild -p android --clean --no-install

      - name: Verify generated Gradle wrapper
        run: |
          set -euo pipefail
          test -x "$GITHUB_WORKSPACE/android/gradlew"
          test -f "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Start emulator and run profile isolation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          force-avd-creation: true
          working-directory: ./android
          script: |
            set -euo pipefail
            adb shell cmd package wait-for-ready
            ./gradlew connectedFullDebugAndroidTest --stacktrace --no-daemon -PreactNativeArchitectures=x86_64
