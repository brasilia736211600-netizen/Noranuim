name: Security Profile Runtime

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-isolation:
    name: Android profile isolation instrumentation
    # Emulator acceleration history on GitHub-hosted runners:
    #  - macOS Intel: fewer than 6 logical cores, so the emulator is forced to a
    #    single virtual core and routinely times out booting or fails to install
    #    the test APKs.
    #  - Ubuntu: /dev/kvm is not usable by the runner user, so the emulator falls
    #    back to pure TCG software emulation and takes ~15 minutes just to boot.
    #  - macOS arm64 (Apple Silicon): native Hypervisor.framework acceleration with
    #    the full core count and an arm64 system image -- the supported combination.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun link
          bun install

      - name: Bundle web assets
        run: bun bundle:es

      - name: Generate Android project
        env:
          NORANUIM_CI_X86: '1'
        run: bun expo prebuild -p android --clean --no-install

      - name: Verify generated Gradle wrapper
        run: |
          set -euo pipefail
          test -x "$GITHUB_WORKSPACE/android/gradlew"
          test -f "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Start emulator and run profile isolation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          force-avd-creation: true
          working-directory: ./android
          script: |
            set -eu
            adb shell cmd package wait-for-ready
            ./gradlew connectedFullDebugAndroidTest --stacktrace --no-daemon -PreactNativeArchitectures=arm64-v8a
