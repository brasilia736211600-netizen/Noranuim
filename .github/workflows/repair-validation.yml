name: Noranuim Repair Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full:
    name: Android full release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun link
      - run: bun install
      - run: bun bundle:es
      - run: bun expo prebuild -p android --clean --no-install
      - working-directory: android
        run: ./gradlew assembleFullRelease --stacktrace --no-daemon
      - run: test -n "$(find android/app/build/outputs/apk/full/release -maxdepth 1 -name '*.apk' -print -quit)"

  foss:
    name: Android FOSS release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: rm -rf modules/nora-view/android/src/full
      - run: bun link
      - run: bun install
      - run: bun bundle:es
      - run: bun expo prebuild -p android --clean --no-install
      - run: |
          set -eu
          {
            echo ''
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m'
            echo 'org.gradle.workers.max=2'
            echo 'org.gradle.parallel=false'
          } >> android/gradle.properties
      - working-directory: android
        run: ./gradlew assembleFossRelease --stacktrace --no-daemon
      - working-directory: android/app/build/outputs/apk/foss/release
        run: |
          test -f app-foss-armeabi-v7a-release-unsigned.apk
          test -f app-foss-arm64-v8a-release-unsigned.apk
