name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build full APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android signing keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" || -z "$ALIAS" || -z "$KEY_STORE_PASSWORD" ]]; then
            echo "Android signing secrets are missing or incomplete."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/noranuim-release.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE"

          ENTRY_TYPE=$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$KEY_STORE_PASSWORD" \
            -alias "$ALIAS" 2>/dev/null \
            | awk -F': ' '/^Entry type:/{print $2; exit}')

          if [[ "$ENTRY_TYPE" != "PrivateKeyEntry" ]]; then
            echo "Invalid Android signing keystore entry type: ${ENTRY_TYPE:-unknown}."
            echo "The configured alias must reference a PrivateKeyEntry."
            exit 1
          fi

          echo "Android signing keystore is valid (PrivateKeyEntry)."
          rm -f "$KEYSTORE"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Show tool versions
        run: |
          set -eux
          node --version
          bun --version
          java -version

      - name: Link workspace
        run: bun link

      - name: Install dependencies
        run: bun install

      - name: Bundle web assets
        run: bun bundle:es

      - name: Generate Android project
        run: bun expo prebuild -p android --clean --no-install

      - name: Show Gradle environment
        working-directory: android
        run: ./gradlew --version

      - name: Build full release APK
        working-directory: android
        run: ./gradlew assembleFullRelease --stacktrace --no-daemon

      - name: Verify full APK output
        run: |
          set -eux
          ls -lah android/app/build/outputs/apk/full/release
          test -f android/app/build/outputs/apk/full/release/app-full-arm64-v8a-release-unsigned.apk
          test -f android/app/build/outputs/apk/full/release/app-full-armeabi-v7a-release-unsigned.apk

      - name: Upload unsigned arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-full-arm64-v8a-release-unsigned
          path: android/app/build/outputs/apk/full/release/app-full-arm64-v8a-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unsigned armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-full-armeabi-v7a-release-unsigned
          path: android/app/build/outputs/apk/full/release/app-full-armeabi-v7a-release-unsigned.apk
          if-no-files-found: error

      - name: Determine release version
        id: version
        run: echo "version_code=$(jq -r '.versionCode' package.json)" >> "$GITHUB_OUTPUT"

      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -eu
          if [[ -n "$SIGNING_KEY" && -n "$ALIAS" && -n "$KEY_STORE_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are missing or incomplete."
            exit 1
          fi

      - name: Set Android build-tools version
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eu
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> "$GITHUB_ENV"
          echo "build-tools version: $BUILD_TOOL_VERSION"

      - name: Sign full APKs
        if: steps.signing.outputs.enabled == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Rename signed APKs
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eux
          shopt -s nullglob
          signed=(android/app/build/outputs/apk/full/release/*-release-unsigned-signed.apk)
          test "${#signed[@]}" -eq 2
          for apk in "${signed[@]}"; do
            mv "$apk" "${apk/-release-unsigned-signed.apk/-release.apk}"
          done

      - name: Verify signed APKs
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eux
          arm64=android/app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk
          armeabi=android/app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk
          apksigner="/usr/local/lib/android/sdk/build-tools/${BUILD_TOOL_VERSION}/apksigner"
          test -x "$apksigner"
          test -f "$arm64"
          test -f "$armeabi"
          "$apksigner" verify --verbose "$arm64"
          "$apksigner" verify --verbose "$armeabi"

      - name: Upload signed arm64-v8a APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nora-full-arm64-v8a-release-signed
          path: android/app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload signed armeabi-v7a APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nora-full-armeabi-v7a-release-signed
          path: android/app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: metadata/en-US/changelogs/${{ steps.version.outputs.version_code }}04.txt
          files: |
            android/app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk
            android/app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk

  build-foss:
    name: Build FOSS APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Show tool versions
        run: |
          set -eux
          node --version
          bun --version
          java -version

      - name: Remove full-only native sources
        run: rm -rf modules/nora-view/android/src/full

      - name: Link workspace
        run: bun link

      - name: Install dependencies
        run: bun install

      - name: Bundle web assets
        run: bun bundle:es

      - name: Generate Android project
        run: bun expo prebuild -p android --clean --no-install

      - name: Apply FOSS Gradle limits
        run: |
          set -eu
          {
            echo ''
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m'
            echo 'org.gradle.workers.max=2'
            echo 'org.gradle.parallel=false'
          } >> android/gradle.properties

      - name: Show Gradle environment
        working-directory: android
        run: ./gradlew --version

      - name: Build FOSS release APKs
        working-directory: android
        run: ./gradlew assembleFossRelease --stacktrace --no-daemon

      - name: Verify FOSS APKs
        working-directory: android/app/build/outputs/apk/foss/release
        run: |
          set -eux
          test -f app-foss-armeabi-v7a-release-unsigned.apk
          test -f app-foss-arm64-v8a-release-unsigned.apk
          for apk in app-foss-*-release-unsigned.apk; do
            if unzip -p "$apk" 'classes*.dex' | strings | grep -E 'com[./]google[./]mlkit'; then
              echo "ML Kit reference found in $apk"
              exit 1
            fi
          done

      - name: Upload FOSS arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-foss-arm64-v8a-release-unsigned
          path: android/app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release-unsigned.apk
          if-no-files-found: error

      - name: Upload FOSS armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-foss-armeabi-v7a-release-unsigned
          path: android/app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release-unsigned.apk
          if-no-files-found: error

  smoke:
    name: Android emulator smoke test
    needs: [build, build-foss]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Download signed Full arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: nora-full-arm64-v8a-release-signed
          path: smoke/full

      - name: Download unsigned FOSS arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: nora-foss-arm64-v8a-release-unsigned
          path: smoke/foss

      - name: Run Full and FOSS smoke tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 4
          ram-size: 4096
          heap-size: 512
          disk-size: 8192M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail

            install_and_smoke() {
              local apk="$1"
              local label="$2"

              echo "=== Installing $label: $apk ==="
              adb install -r "$apk"

              echo "=== Resolving launch activity ==="
              activity=$(adb shell cmd package resolve-activity --brief jp.nonbili.nora | tr -d '\r' | tail -n 1)
              test -n "$activity"
              test "$activity" != "No activity found"
              echo "Resolved activity: $activity"

              echo "=== Cold launch: $label ==="
              adb shell am force-stop jp.nonbili.nora
              adb shell am start -W -n "$activity"
              sleep 8

              echo "=== Process liveness: $label ==="
              pid=$(adb shell pidof jp.nonbili.nora | tr -d '\r' || true)
              test -n "$pid"

              echo "=== Foreground activity: $label ==="
              top=$(adb shell dumpsys activity activities | grep -m1 'mResumedActivity' || true)
              echo "$top"
              echo "$top" | grep -q 'jp.nonbili.nora'

              echo "=== Relaunch after force-stop: $label ==="
              adb shell am force-stop jp.nonbili.nora
              adb shell am start -W -n "$activity"
              sleep 5
              pid=$(adb shell pidof jp.nonbili.nora | tr -d '\r' || true)
              test -n "$pid"
            }

            trap 'adb logcat -d -v time > smoke-logcat.txt; grep -E "FATAL EXCEPTION|ANR in jp\.nonbili\.nora|Process: jp\.nonbili\.nora" smoke-logcat.txt || true' EXIT

            install_and_smoke smoke/full/app-full-arm64-v8a-release.apk "Full arm64-v8a"
            adb uninstall jp.nonbili.nora
            install_and_smoke smoke/foss/app-foss-arm64-v8a-release-unsigned.apk "FOSS arm64-v8a"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noranuim-android-smoke-diagnostics
          path: smoke-logcat.txt
          if-no-files-found: ignore
