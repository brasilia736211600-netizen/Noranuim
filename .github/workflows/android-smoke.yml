name: Android Smoke Test

on:
  workflow_run:
    workflows: [Build APK]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build APK workflow run ID to test'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    name: Full + FOSS Android smoke
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout smoke workflow
        uses: actions/checkout@v5

      - name: Select source Build APK run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_id="$MANUAL_RUN_ID"
          else
            run_id="$WORKFLOW_RUN_ID"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Testing Build APK workflow run: $run_id"

      - name: Download signed Full arm64-v8a artifact
        uses: actions/download-artifact@v5
        with:
          name: nora-full-arm64-v8a-release-signed
          path: smoke/full
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Download unsigned FOSS arm64-v8a artifact
        uses: actions/download-artifact@v5
        with:
          name: nora-foss-arm64-v8a-release-unsigned
          path: smoke/foss
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Prepare Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          force-avd-creation: true
          script: |
            set -euo pipefail

            mkdir -p smoke/diagnostics
            full_apk="smoke/full/app-full-arm64-v8a-release.apk"
            foss_apk="smoke/foss/app-foss-arm64-v8a-release-unsigned.apk"
            test -f "$full_apk"
            test -f "$foss_apk"

            build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            aapt2="$build_tools/aapt2"
            apksigner="$build_tools/apksigner"
            test -x "$aapt2"
            test -x "$apksigner"

            package_name=$("$aapt2" dump badging "$full_apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
            static_activity=$("$aapt2" dump badging "$full_apk" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -n 1)
            test -n "$package_name"
            test -n "$static_activity"

            echo "Full APK SHA-256: $(shasum -a 256 "$full_apk" | awk '{print $1}')" | tee smoke/diagnostics/full-sha256.txt
            echo "FOSS unsigned SHA-256: $(shasum -a 256 "$foss_apk" | awk '{print $1}')" | tee smoke/diagnostics/foss-unsigned-sha256.txt
            echo "Package: $package_name" | tee smoke/diagnostics/package.txt
            echo "Static launcher: $static_activity" | tee smoke/diagnostics/static-activity.txt

            "$apksigner" verify --verbose "$full_apk" | tee smoke/diagnostics/full-signature.txt

            sign_foss_for_runtime() {
              local keystore="$RUNNER_TEMP/noranuim-smoke-foss.jks"
              local signed="$RUNNER_TEMP/noranuim-foss-smoke-signed.apk"
              keytool -genkeypair -noprompt \
                -keystore "$keystore" \
                -storepass android \
                -keypass android \
                -alias smoke \
                -keyalg RSA \
                -keysize 2048 \
                -validity 1 \
                -dname 'CN=Noranuim CI Smoke Test,O=Noranuim,C=US' >/dev/null 2>&1
              "$apksigner" sign \
                --ks "$keystore" \
                --ks-pass pass:android \
                --key-pass pass:android \
                --out "$signed" \
                "$foss_apk"
              mv "$signed" "$foss_apk"
              "$apksigner" verify --verbose "$foss_apk" | tee smoke/diagnostics/foss-signature.txt
              rm -f "$keystore"
            }

            wait_for_running() {
              local deadline=$((SECONDS + 120))
              local pid
              while (( SECONDS < deadline )); do
                pid=$(adb shell pidof "$package_name" | tr -d '\r' | xargs || true)
                if [[ -n "$pid" ]]; then
                  echo "Process running: $pid"
                  return 0
                fi
                sleep 2
              done
              echo "Timed out waiting for $package_name process" >&2
              return 1
            }

            wait_for_resumed() {
              local deadline=$((SECONDS + 120))
              local resumed
              while (( SECONDS < deadline )); do
                resumed=$(adb shell dumpsys activity activities | grep -m1 'mResumedActivity' || true)
                if [[ "$resumed" == *"$package_name"* ]]; then
                  echo "Resumed: $resumed"
                  return 0
                fi
                sleep 2
              done
              echo "Timed out waiting for resumed activity" >&2
              adb shell dumpsys activity activities > smoke/diagnostics/activity-timeout.txt || true
              return 1
            }

            assert_no_crash_signatures() {
              local log="$1"
              if grep -E "FATAL EXCEPTION|ANR in ${package_name}|Process: ${package_name}" "$log"; then
                echo "Crash/ANR signature detected for $package_name" >&2
                return 1
              fi
            }

            smoke_apk() {
              local apk="$1"
              local label="$2"
              local safe_label="${label// /-}"

              echo "=== $label ==="
              adb install -r "$apk"

              activity="$(adb shell cmd package resolve-activity --brief "$package_name" | tr -d '\r' | awk 'NF {last=$0} END {print last}')"
              test -n "$activity"
              test "$activity" != "No activity found"
              echo "Resolved activity: $activity" | tee "smoke/diagnostics/${safe_label}-resolved-activity.txt"

              adb shell am force-stop "$package_name"
              adb logcat -c

              echo "Cold launch"
              adb shell am start -W -n "$activity" | tee "smoke/diagnostics/${safe_label}-cold-start.txt"
              wait_for_running
              wait_for_resumed
              adb exec-out screencap -p > "smoke/diagnostics/${safe_label}-cold-launch.png"

              adb shell dumpsys activity activities > "smoke/diagnostics/${safe_label}-activity.txt"
              adb shell dumpsys package "$package_name" > "smoke/diagnostics/${safe_label}-package.txt"
              adb logcat -d -v time > "smoke/diagnostics/${safe_label}-first-logcat.txt"
              assert_no_crash_signatures "smoke/diagnostics/${safe_label}-first-logcat.txt"

              echo "Force-stop + relaunch"
              adb shell am force-stop "$package_name"
              adb shell am start -W -n "$activity" | tee "smoke/diagnostics/${safe_label}-relaunch.txt"
              wait_for_running
              wait_for_resumed
              adb exec-out screencap -p > "smoke/diagnostics/${safe_label}-relaunch.png"
              adb logcat -d -v time > "smoke/diagnostics/${safe_label}-relaunch-logcat.txt"
              assert_no_crash_signatures "smoke/diagnostics/${safe_label}-relaunch-logcat.txt"

              adb shell am force-stop "$package_name"
              echo "$label PASS"
            }

            trap 'set +e; adb shell dumpsys activity activities > smoke/diagnostics/final-activity.txt 2>&1; adb shell dumpsys package "$package_name" > smoke/diagnostics/final-package.txt 2>&1; adb logcat -d -v time > smoke/diagnostics/final-logcat.txt 2>&1; adb exec-out screencap -p > smoke/diagnostics/final-screen.png 2>/dev/null; true' EXIT

            sign_foss_for_runtime
            smoke_apk "$full_apk" "Full arm64-v8a signed"
            adb uninstall "$package_name"
            smoke_apk "$foss_apk" "FOSS arm64-v8a CI-signed"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noranuim-android-smoke-diagnostics-${{ steps.source.outputs.run_id }}
          path: smoke/diagnostics
          if-no-files-found: error

      - name: Smoke result summary
        if: success()
        run: |
          echo "Android smoke test passed for Build APK run ${{ steps.source.outputs.run_id }}."
          echo "The production-signed Full APK and the FOSS APK (signed ephemerally for runtime testing) both launched and survived a force-stop/relaunch cycle."
