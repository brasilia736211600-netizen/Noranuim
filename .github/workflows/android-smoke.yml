name: Android Smoke Test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Optional Build APK workflow run ID; leave empty to use the latest successful main build'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    name: Full + FOSS Android smoke
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select source Build APK run
        id: source
        shell: bash
        env:
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$MANUAL_RUN_ID" ]]; then
            [[ "$MANUAL_RUN_ID" =~ ^[0-9]+$ ]]
            run_id="$MANUAL_RUN_ID"
            echo "Using explicitly requested Build APK run: $run_id"
          else
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
            [[ "$run_id" =~ ^[0-9]+$ ]]
            echo "Using latest successful Build APK run on main: $run_id"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download signed Full arm64-v8a artifact
        uses: actions/download-artifact@v4
        with:
          name: nora-full-arm64-v8a-release-signed
          path: smoke/full-arm64
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download signed Full x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nora-full-x86_64-release-signed
          path: smoke/full-x86_64
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download unsigned FOSS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nora-foss-x86_64-release-unsigned
          path: smoke/foss-x86_64
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          arm64="smoke/full-arm64/app-full-arm64-v8a-release.apk"
          x64="smoke/full-x86_64/app-full-x86_64-release.apk"
          foss="smoke/foss-x86_64/app-foss-x86_64-release-unsigned.apk"
          test -f "$arm64"
          test -f "$x64"
          test -f "$foss"
          echo "Source Build APK run: ${{ steps.source.outputs.run_id }}"
          echo "Full arm64 SHA-256: $(shasum -a 256 "$arm64")"
          echo "Full x86_64 SHA-256: $(shasum -a 256 "$x64")"
          echo "FOSS x86_64 SHA-256: $(shasum -a 256 "$foss")"

          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"
          test -x "$apksigner"
          test -x "$aapt2"
          "$apksigner" verify --verbose "$arm64" > arm64-signature.txt
          "$apksigner" verify --verbose "$x64" > x86_64-signature.txt
          arm_pkg=$("$aapt2" dump badging "$arm64" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)
          x64_pkg=$("$aapt2" dump badging "$x64" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)
          test "$arm_pkg" = "$x64_pkg"
          echo "Package: $arm_pkg"

      - name: Start Android emulator and run smoke tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          force-avd-creation: true
          script: bash .github/scripts/android-smoke.sh

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noranuim-android-smoke-diagnostics-${{ steps.source.outputs.run_id }}
          path: smoke/diagnostics
          if-no-files-found: warn

      - name: Smoke result summary
        if: success()
        run: |
          echo "Android smoke test passed for Build APK run ${{ steps.source.outputs.run_id }}."
          echo "The exact arm64 release APK was statically signature-verified; x86_64 Full and FOSS artifacts were runtime-tested on Intel Android Emulator."
